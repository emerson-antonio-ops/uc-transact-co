[project]
name = "transactco"
version = "0.1.0"
description = "TransactCo brownfield base: Postgres source, defect generator, sealed oracle, DuckDB landing."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "duckdb>=1.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dbt = ["dbt-duckdb>=1.9"]

[project.scripts]
transactco = "transactco.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transactco"]
